[Runtime]

## Legacy creator-surface key; migrated into CreatorBarHotkey.
# Setting type: KeyboardShortcut
# Default value: F9
DrawerHotkey = F9

## Expand or minimize the always-present overhead creator bar.
# Setting type: KeyboardShortcut
# Default value: F9
CreatorBarHotkey = F9

## Check inbox without activating content.
# Setting type: KeyboardShortcut
# Default value: F10
CheckHotkey = F10

## Activate the highest compatible version.
# Setting type: KeyboardShortcut
# Default value: F11
LoadLatestHotkey = F11

## While the creator bar is expanded: first press CHECKS and captures the aimed target; second press CASTS onto that exact target.
# Setting type: KeyboardShortcut
# Default value: BackQuote
CharmGestureHotkey = BackQuote

[Safety]

## Required before Charm inscription or mutation. Enable only for a private solo/listen-host world you control.
# Setting type: Boolean
# Default value: false
PrivateWorldConfirmed = true

[Presentation]

## Legacy vertical alert position; migrated into AlertAnchorY.
# Setting type: Single
# Default value: 0.16
DeadlineAnchor = 0.16

## Horizontal center of the single alert anchor as a screen fraction.
# Setting type: Single
# Default value: 0.5
AlertAnchorX = 0.5

## Top of the single alert anchor as a screen fraction.
# Setting type: Single
# Default value: 0.16
AlertAnchorY = 0.16
