[Runtime]

## Open the compact runtime drawer.
# Setting type: KeyboardShortcut
# Default value: F9
DrawerHotkey = F9

## Check inbox without activating content.
# Setting type: KeyboardShortcut
# Default value: F10
CheckHotkey = F10

## Activate the highest compatible version.
# Setting type: KeyboardShortcut
# Default value: F11
LoadLatestHotkey = F11

[Safety]

## Required before Charm inscription or mutation. Enable only for a private solo/listen-host world you control.
# Setting type: Boolean
# Default value: false
PrivateWorldConfirmed = true
