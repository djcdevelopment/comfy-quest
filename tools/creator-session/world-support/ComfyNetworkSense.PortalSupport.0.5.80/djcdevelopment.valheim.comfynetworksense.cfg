zdoSendCadenceOverrideEnabled = false

## Seconds between forced per-peer SendZDOs passes when zdoSendCadenceOverrideEnabled is ON. 0.05s is 20Hz, matching the proven Comfy-era posture; values below 0.02s are clamped.
# Setting type: Single
# Default value: 0.05
zdoSendCadenceOverrideIntervalSeconds = 0.05

## Phase 0 of the ownership/visibility split (ADR 0013): co-presence SHADOW. OFF (default) = no effect. ON = for each admitted ZDO, compute which OTHER connected observers are in-band (near/mid) for it and emit a 'copresence_shadow' telemetry row naming them — WITHOUT changing delivery. Zero behaviour change: it only measures the fan-out a correct model would produce, so the log names the exact shared-area ZDOs a co-located player is starved of under today's single-recipient stamping. Hot-reloadable; arm only during a 2+ client shadow test (it iterates all peers per admitted candidate).
# Setting type: Boolean
# Default value: false
zdoCoPresenceShadowEnabled = false

## Phase 2 of the ownership/visibility split (ADR 0013): co-presence FAN-OUT. OFF (default) = today's single-recipient delivery, byte-for-byte. ON = the one CreateSyncList pass that sees a contended ZDO emits a read copy to EVERY in-band observer (each stamped for its own recipient, its own m_zdos acked), so co-located players all see the same buildings/portals — reuses Redirect, so queue/dedup/ack behaviour is unchanged. One logical revision produces at most one redirect per recipient. Ownership is NOT changed. This REPLACES the single-recipient path per candidate; flip it off for instant rollback. Arm only with the shadow verified first (they share the same evaluation).
# Setting type: Boolean
# Default value: false
zdoCoPresenceFanoutEnabled = false

## P6/I5 server-side handshake responder rollback flag (am4 only). When armed, a Harmony hook answers RPC_ServerHandshake/RPC_PeerInfo with decisions supplied by the Lumberjacks handshake responder (Steam-only per I6). off = pure pass-through; an empty endpoint also refuses to arm. Fail-safe default OFF. NB: the RPC interceptor is built + wire-validated at the armed session (first real-client bytes in-game).
# Setting type: Boolean
# Default value: false
