zdoInjectionPrefabs = Wood

zdoInjectionEndpoint = http://127.0.0.1:14000

zdoInjectionWindowId = p7-primary-v1

zdoInjectionClientId = omen

zdoInjectionAuthorityId = 5497853135698

zdoInjectionPollSeconds = 1

zdoInjectionActiveSeconds = 90

[Perf]

## Write perf-hitches.jsonl, perf-sections.jsonl, and perf-engine-log.jsonl for main-thread hitch investigation.
# Setting type: Boolean
# Default value: true
perfProbeEnabled = false

## Write one worker-thread perf-watchdog.jsonl row when the Unity main thread stops advancing. No gameplay behavior is changed.
# Setting type: Boolean
# Default value: true
perfWatchdogEnabled = false

## Seconds without a main-thread heartbeat before the worker watchdog records a stall; clamped to 0.5..60.
# Setting type: Single
# Default value: 2
perfWatchdogThresholdSeconds = 2

## Worker watchdog polling interval in seconds; clamped to 0.1..5.
# Setting type: Single
# Default value: 0.5
perfWatchdogPollSeconds = 0.5

## Frame duration threshold for writing perf-hitches.jsonl.
# Setting type: Single
# Default value: 250
hitchThresholdMs = 250

## Frame duration threshold for tagging a hitch as severe.
# Setting type: Single
# Default value: 2000
severeHitchThresholdMs = 2000

## Section duration threshold for writing perf-sections.jsonl.
# Setting type: Single
# Default value: 25
sectionWarnThresholdMs = 25

## Count Unity/BepInEx log messages using Application.logMessageReceivedThreaded.
# Setting type: Boolean
# Default value: true
engineLogProbeEnabled = false

## Call ZDOMan.NrOfObjects() when writing severe hitch rows. This can amplify hitches on massive saves; keep disabled unless explicitly testing world-count cost.
# Setting type: Boolean
# Default value: false
worldZdoCountOnSevereHitchEnabled = false

## Minimum seconds between perf-engine-log.jsonl aggregate rows.
# Setting type: Single
# Default value: 1
perfSampleIntervalSeconds = 1

## Accumulate per-call timing inside Harmony patch bodies and write per-interval rollups to perf-patchload.jsonl. Lab measurement aid; keep disabled for volunteers.
# Setting type: Boolean
# Default value: false
perfPatchLoadRollupEnabled = false

[PortalFix]

## Replace Valheim's server portal connection scan with a cached tag lookup. Intended for massive portal-count lab worlds.
# Setting type: Boolean
# Default value: true
portalConnectionCacheEnabled = true

## Seconds between cached server portal connection passes.
# Setting type: Single
# Default value: 5
portalConnectionCacheIntervalSeconds = 5

## Minimum seconds between cached portal-loop summary log rows. Set to 0 to disable summary logging.
# Setting type: Single
# Default value: 60
portalConnectionCacheLogIntervalSeconds = 60

[Sampling]

## How often client samples are captured and written.
# Setting type: Single
# Default value: 0.5
liveSampleIntervalSeconds = 1

## How often the server broadcasts a pulse snapshot.
# Setting type: Single
# Default value: 3
serverPulseIntervalSeconds = 3

## Include ZDOMan.NrOfObjects() in server heartbeat rows. This can be very expensive on massive saves; keep disabled for hitch isolation.
# Setting type: Boolean
# Default value: false
serverHeartbeatWorldZdoCountEnabled = false

## Minimum seconds between world ZDO count refreshes when serverHeartbeatWorldZdoCountEnabled is true.
# Setting type: Single
# Default value: 300
serverHeartbeatWorldZdoCountIntervalSeconds = 300

## Radius used for nearby player and entity counts.
# Setting type: Single
# Default value: 64
nearbyRadiusMeters = 64

## Radius used for nearby build piece counts.
# Setting type: Single
# Default value: 64
buildScanRadiusMeters = 64

## Capture nearby entity/build-piece counts. Disable for perf isolation runs.
# Setting type: Boolean
# Default value: true
sceneScanEnabled = false

## Minimum seconds between local scene scans for nearby entity/build-piece counts.
# Setting type: Single
# Default value: 2
sceneScanIntervalSeconds = 2

[ServerControl]

## Dedicated-server-only, filesystem command lane for a fixed allowlist of networking rollback settings. Commands must arrive through authenticated host access and are consumed from BepInEx/config/comfy-network-sense/runtime-control.json. No console execution and no arbitrary config keys. Fail-safe default OFF.
# Setting type: Boolean
# Default value: false
serverRuntimeControlEnabled = false

## Seconds between dedicated-server checks for one atomically staged runtime-control command; clamped to 0.25..10 seconds.
# Setting type: Single
# Default value: 1
serverRuntimeControlPollSeconds = 1

[SpawnerFix]

## Replace Valheim's spawner connection pass with an O(n) cached hash lookup. Intended for massive spawned-ZDO lab worlds.
# Setting type: Boolean
# Default value: true
spawnerConnectionCacheEnabled = true

