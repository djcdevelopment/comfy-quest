## P4/I3 outbound REDIRECT. BEHAVIOUR-CHANGING (server-side/am4 only), rollback flag. When on, a server-side Harmony postfix on ZDOMan.CreateSyncList removes allowlisted-prefab ZDOs from the native send list (replicating the native per-peer ack so revision bookkeeping stays exact) and posts the wire-equivalent payload to the Lumberjacks gateway instead. Writes no persisted ZDO state (send path is runtime bookkeeping only). Non-tagged ZDOs sync normally (the negative control). REFUSES to arm with an empty prefab allowlist. off = vanilla behaviour, zero cost. THIS IS THE LIVE SERVING PATH in lumberjacks-primary mode, not a lab experiment - the description said 'intended for private lab runs' long after it began carrying production traffic. It still defaults OFF deliberately: off IS the standing rollback, so a mod dropped into any server changes nothing until armed.
# Setting type: Boolean
# Default value: false
zdoRedirectEnabled = false

## Comma-separated prefab name allowlist for the redirect (e.g. 'Beech1'). REQUIRED — unlike the pin, blank does NOT mean 'any': suppressing every ZDO would freeze world sync for the client, so an empty list refuses to start. The explicit value '*' selects all prefabs and must only be armed behind the authoritative coverage gate. Names are otherwise matched by stable hash.
# Setting type: String
# Default value: 
zdoRedirectPrefabs = 

## Base URL of the Lumberjacks gateway (OMEN tailnet). The runner POSTs envelope batches to <endpoint>/valheim/zdo-redirect/receipts. The gateway must be launched with a 0.0.0.0 bind (its appsettings default is localhost-only).
# Setting type: String
# Default value: http://100.124.12.37:4000
zdoRedirectEndpoint = http://127.0.0.1:14000

## Window id stamped on every envelope + local row (the gate join key against the gateway's per-window receipt counters). Blank = auto 'i3-<utc timestamp>' per run.
# Setting type: String
# Default value: 
zdoRedirectWindowId = 

## 0 = no cap, which is the production posture (infra/gcp/p7/README.md pins it). Defaulted to 90 until 2026-07-21, which meant a VM configured from defaults would silently auto-disarm the redirect 90s into a session and resume native sync - the safe value lived only in a runbook. The finite window is now opt-in. Suppression sub-window in seconds. Set SHORTER than the netcode-probe window and the redirect auto-disarms mid-capture, so the still-running probe records native sends of the tagged prefab RESUMING — the in-window rollback rehearsal (P4 step 11), hands-free. 0 = suppress for the whole probe window.
# Setting type: Single
# Default value: 0
zdoRedirectActiveSeconds = 90

## Final Importance gate for the Lumberjacks network boundary. A candidate survives only when LumberjacksPriorityClassifier assigns a rank at or below this value. Rejected candidates remain in Valheim's native send list and never enter the Gateway payload. 6 preserves the prior all-tier behavior; 4 admits the proven interactive/structural/storage lanes while leaving support/decorative work native.
# Setting type: Int32
# Default value: 6
zdoRedirectMaxPriorityRank = 6

## Landmark reach map: comma-separated 'prefabName=reachMeters' entries granting an object long-range PRESENCE (landmark-reach-design.md). A landmark is admitted at the redirect boundary when the observer is within its reach EVEN IF its priority rank exceeds zdoRedirectMaxPriorityRank — the parallel reliable-lane exemption. Blank = no landmarks (rank gate alone decides). Names matched by stable hash, same as zdoRedirectPrefabs; entries with a missing or non-positive reach are ignored. A landmark is static, so this adds no per-tick datagram cost — it only widens what redirect admits, once, at arrival.
# Setting type: String
# Default value: 
zdoLandmarkReach = 

## Master switch for distance-band AoI rate-shaping of the ZDO redirect (aoi-baseline-20260721). OFF (default) = today's behaviour: every admitted ZDO is redirected on every sync pass. ON = shape by the observing peer's distance: near (0..inner) full rate, mid (inner..outer) thinned to zdoThinHz, far (>outer) dropped, landmarks (zdoLandmarkReach) always emitted. Hot-reloadable — flip it off to revert an armed redirect to 1:1 live.
# Setting type: Boolean
# Default value: false
zdoBandShapingEnabled = false

## Inner band edge in meters (zdoBandShapingEnabled). Objects at or within this distance of the observing peer are redirected every pass — where the player actually interacts. The baseline showed the full-rate band is the whole cost, and area goes as r², so ~30m removes most of the objects a 50m band carried.
# Setting type: Single
# Default value: 30
zdoInnerRadiusMeters = 30

## Outer band edge in meters (zdoBandShapingEnabled). Objects beyond this are DROPPED (not emitted, re-evaluated as the peer moves). Defaults to 64 = Valheim's zone size (nearbyRadiusMeters/buildScanRadiusMeters), so a dropped object is outside the loaded, active zone — both systems agree nothing is needed there.
# Setting type: Single
# Default value: 64
zdoOuterRadiusMeters = 64

## Mid-band (inner..outer) emit rate in Hz (zdoBandShapingEnabled). The mid band is thinned to at most this many redirects/second per (peer, object) — 20Hz→5Hz takes most of the bandwidth saving with none of the staleness risk of dropping, since the object is still inside the active zone. <=0 disables thinning (mid emits every pass).
# Setting type: Single
# Default value: 5
zdoThinHz = 5

## When zdoBandShapingEnabled is ON, player-character ZDOs bypass distance thinning/drop and are redirected every native sync pass. This protects remote avatar motion from the static-world AoI policy while keeping buildings/decor shaped. Hot-reloadable.
# Setting type: Boolean
# Default value: true
zdoPlayerFastLaneEnabled = false

## Experimental server-side send-loop cadence override inspired by the classic Comfy ReturnToSender idea, implemented locally rather than copied. OFF = vanilla ZDOMan.Update scheduler. ON = call SendZDOs(peer, flush:false) for each connected peer at the configured interval. Behaviour-changing; enable only during a measured alpha pass.
# Setting type: Boolean
